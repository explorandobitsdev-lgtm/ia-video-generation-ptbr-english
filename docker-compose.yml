services:
  app:
    build:
      context: .
      args:
        INSTALL_VIDEO_AI: ${INSTALL_VIDEO_AI:-false}
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      USE_OLLAMA: ${USE_OLLAMA:-true}
      DEFAULT_VISUAL_BACKEND: ${DEFAULT_VISUAL_BACKEND:-template}
      DATA_DIR: /app/data
      JOBS_DIR: /app/data/jobs
      OUTPUTS_DIR: /app/data/outputs
      TMP_DIR: /app/data/tmp
      PIPER_DOWNLOAD_DIR: /app/data/piper
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: curlimages/curl:8.12.1
    profiles: ["setup"]
    depends_on:
      - ollama
    entrypoint:
      - sh
      - -c
      - |
        until curl -fsS http://ollama:11434/api/version >/dev/null; do sleep 2; done
        curl -fsS http://ollama:11434/api/pull -d "{\"model\":\"${OLLAMA_MODEL:-llama3.2}\"}"

volumes:
  ollama-data:
