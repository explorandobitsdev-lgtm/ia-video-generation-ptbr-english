[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kids-bilingual-video-studio"
version = "0.1.0"
description = "Aplicacao Docker para criar videos infantis bilingues com roteiro, narracao e renderizacao local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.28,<1.0",
  "imageio-ffmpeg>=0.6,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "Pillow>=11.0,<12.0",
  "piper-tts>=1.2,<2.0",
]

[project.scripts]
kids-video = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]
video-ai = [
  "torch>=2.6,<3.0",
  "diffusers>=0.35,<1.0",
  "transformers>=4.49,<5.0",
  "accelerate>=1.3,<2.0",
  "sentencepiece>=0.2,<1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
